<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Top purple ribbon gradient -->
    <linearGradient id="purpleRibbon" x1="120" y1="80" x2="380" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Middle royal blue ribbon gradient -->
    <linearGradient id="blueRibbon" x1="140" y1="180" x2="350" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Bottom cyan flow gradient -->
    <linearGradient id="cyanRibbon" x1="130" y1="260" x2="280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="ribbonShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Top Curve of F -->
  <path d="M 175 220 C 160 140, 200 80, 360 80 C 375 80, 385 92, 375 105 C 350 135, 270 145, 220 150 C 250 150, 330 145, 350 145 C 365 145, 370 160, 355 170 C 310 200, 240 215, 175 220 Z" 
        fill="url(#purpleRibbon)" 
        filter="url(#ribbonShadow)" />

  <!-- Middle Bar of F -->
  <path d="M 150 290 C 140 210, 180 160, 340 160 C 352 160, 358 172, 348 182 C 300 220, 240 225, 185 235 C 220 235, 300 228, 320 228 C 335 228, 340 242, 325 252 C 275 285, 200 290, 150 290 Z" 
        fill="url(#blueRibbon)" 
        filter="url(#ribbonShadow)" />

  <!-- Base Stem / Sweep of F -->
  <path d="M 135 300 C 130 240, 155 180, 200 130 C 180 200, 140 280, 150 340 C 158 390, 200 405, 220 380 C 235 360, 230 330, 200 320 C 170 310, 140 320, 135 300 Z" 
        fill="url(#cyanRibbon)" />
</svg>
